name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the spatial engineering source
        run: git lfs pull --include='projects/map/campus.gpkg'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.17'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare the project environment
        run: |
          uv venv --python 3.12
          uv sync --locked
      - name: Check source contracts
        run: |
          uv run python -m src.map.export
          uv run python -m src.map.validate
          uv run python -m src.observations.validate --public
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m src.sync.plan
