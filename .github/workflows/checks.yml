name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sources:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.17'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare the project environment
        run: |
          uv venv --python 3.12
          uv sync --locked
      - name: Check source contracts
        run: |
          uv run python src/map/format_geojson.py --check
          uv run python src/map/build_authored.py
          uv run python -m src.observations.validate --public
