name: Release authored map
on:
  push:
    tags: ['map-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STUDEV_DISPATCH_TOKEN: ${{ secrets.STUDEV_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.17'
          python-version: '3.12'
      - run: uv venv --python 3.12
      - run: uv sync --locked
      - run: uv run python src/map/format_geojson.py --check
      - run: uv run python src/map/build_authored.py
      - run: uv run python src/map/release.py "${GITHUB_REF_NAME#map-v}"
      - name: Create immutable GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/release/njupt-map-*.tar.gz build/release/manifest.json --title "$GITHUB_REF_NAME" --notes "Authored campus map"
      - name: Notify studev with map version only
        if: env.STUDEV_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.STUDEV_DISPATCH_TOKEN }}
        run: gh api repos/hicancan/studev/dispatches -f event_type=upstream-release -f client_payload[map_version]="$GITHUB_REF_NAME"
