name: Release authored map
on:
  push:
    tags: ['map-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.17'
          python-version: '3.12'
      - run: uv venv --python 3.12
      - run: uv sync --locked
      - run: uv run python src/map/release.py "${GITHUB_REF_NAME#map-v}"
      - name: Notify studev of map release
        env:
          GH_TOKEN: ${{ secrets.STUDEV_DISPATCH_TOKEN }}
        run: gh api repos/NJUPT-CS-StuDev/studev/dispatches -f event_type=upstream-release -f 'client_payload[side]=map' -f "client_payload[version]=$GITHUB_REF_NAME"
