[project]
name = "njupt-map"
version = "0.2.0"
description = "Observation-driven GIS and Blender engineering for the NJUPT Xianlin campus"
requires-python = ">=3.12,<3.13"
dependencies = ["shapely==2.1.2", "pyproj==3.8.0", "pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
observations = ["pymupdf==1.28.2"]

[project.urls]
Repository = "https://github.com/hicancan/njupt-map"

[tool.uv]
package = false
